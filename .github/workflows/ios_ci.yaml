name: Flutter iOS CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-ios:
    # Bắt buộc phải dùng máy ảo Mac để chạy môi trường Xcode
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Flutter với phiên bản của bạn
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.2'

      - name: Install dependencies
        run: flutter pub get

      # Tạo các file .env từ GitHub Secrets để Flutter đóng gói asset
      - name: Create .env files
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
          ENABLE_LOG: ${{ secrets.ENABLE_LOG }}
        run: |
          echo "BACKUP_SECRET_KEY=$BACKUP_SECRET_KEY" > .env

          cat << EOF > .env.dev
          APP_ENV=dev
          BACKUP_SECRET_KEY=$BACKUP_SECRET_KEY
          ENABLE_LOG=true
          EOF

          cat << EOF > .env.prod
          APP_ENV=$APP_ENV
          BACKUP_SECRET_KEY=$BACKUP_SECRET_KEY
          ENABLE_LOG=$ENABLE_LOG
          EOF

      - name: Run intl_utils generate
        run: flutter pub run intl_utils:generate

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      #- name: Run tests
      #  run: flutter test

      # Build iOS Simulator (Kiểm tra khả năng biên dịch, không cần Apple Team/Codesign)
      - name: Build iOS Simulator
        run: flutter build ios --simulator -t lib/main_prod.dart
        env: # Truyền token vào môi trường máy ảo cho luồng build này
          API_TOKEN: ${{ secrets.SECRET_TOKEN }}